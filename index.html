<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Time + 8h30m - 6h30m</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/@emotion/react@11.10.6/dist/emotion-react.umd.min.js"></script>
    <script src="https://unpkg.com/@emotion/styled@11.10.6/dist/emotion-styled.umd.min.js"></script>
    <script src="https://unpkg.com/@mui/material@5.13.7/umd/material-ui.production.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script>
        const {
            ThemeProvider, createTheme, CssBaseline, Container, Card, CardContent,
            Typography, Stack, TextField, Button, ToggleButton, ToggleButtonGroup
        } = MaterialUI;
        const { useState } = React;
        const e = React.createElement;

        function TimePlusEightHalfHours() {
            const [mode, setMode] = useState("time");
            const [value, setValue] = useState("09:00");
            const [result, setResult] = useState(null);
            const [shortLeave, setShortLeave] = useState(null);
            const [error, setError] = useState("");

            const theme = createTheme({
                palette: { primary: { main: "#1565c0" } }
            });

            function addHours(date, hours, minutes) {
                return new Date(date.getTime() + (hours * 60 + minutes) * 60 * 1000);
            }

            function parseInputToDate(val) {
                if (!val) return null;
                try {
                    const now = new Date();
                    const parts = val.split(":").map((s) => parseInt(s, 10));
                    if (parts.length < 2) return null;
                    let [hh, mm] = parts;
                    if (Number.isNaN(hh) || Number.isNaN(mm)) return null;
                    if (hh >= 1 && hh <= 12) hh = hh % 12;
                    return new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm);
                } catch (e) { return null; }
            }

            function formatFull(d) {
                if (!d) return "-";
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            function handleCalculate() {
                setError("");
                const parsed = parseInputToDate(value);
                if (!parsed) {
                    setError("Please enter a valid time.");
                    setResult(null);
                    return;
                }
                setResult({ newTime: addHours(parsed, 8, 30) });
                setShortLeave({ newShortTime: addHours(parsed, 6, 30) });
            }

            // Native DOM tree configuration without JSX compilation requirements
            return e(ThemeProvider, { theme },
                e(CssBaseline),
                e(Container, { maxWidth: "sm", sx: { mt: 6 } },
                    e(Card, { elevation: 6, sx: { borderRadius: 3 } },
                        e(CardContent, null,
                            e(Stack, { spacing: 2 },
                                e(Typography, { variant: "h5" }, "Check exit time (+6h30m/ +8h30m)"),
                                e(Typography, { variant: "body2", color: "text.secondary" }, "Enter a punch time, and get exact out time without wasting your energy."),
                                e(ToggleButtonGroup, { value: mode, exclusive: true, size: "small" },
                                    e(ToggleButton, { value: "time" }, "Time only")
                                ),
                                e(TextField, {
                                    label: "Start time", type: "time", value: value,
                                    onChange: (event) => setValue(event.target.value),
                                    InputLabelProps: { shrink: true }, fullWidth: true
                                }),
                                e(Stack, { direction: "row", spacing: 2 },
                                    e(Button, { variant: "contained", onClick: handleCalculate }, "Calculate"),
                                    e(Button, { variant: "outlined", onClick: () => { setValue(""); setResult(null); setError(""); } }, "Clear")
                                ),
                                error && e(Typography, { color: "error", variant: "body2" }, error),
                                result && e(Card, { variant: "outlined", sx: { p: 2 } },
                                    e(Stack, { spacing: 1 },
                                        e(Typography, { variant: "subtitle2", sx: { mt: 1 } }, "Short Leave (+6.5 hrs)"),
                                        e(Typography, { variant: "h6" }, formatFull(shortLeave.newShortTime)),
                                        e(Typography, { variant: "subtitle2" }, "Result (+8.5 hrs)"),
                                        e(Typography, { variant: "h5" }, formatFull(result.newTime))

                                    )
                                ),
                                e(Typography, { variant: "caption", color: "text.secondary" }, "Thanks for using this!... Bhushan 😊✌️"),

                            )
                        )
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(e(TimePlusEightHalfHours));
    </script>
</body>

</html>
